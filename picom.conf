# ~/i3-setup/picom.conf — picom v13 (verified with `picom --version`)
#
# Derived from /usr/share/doc/picom/picom.sample.conf, which ships with the
# installed package and therefore matches this version.
# Every non-default option below is documented in `man 1 picom` on this machine.
# Validate with:  picom --config ~/i3-setup/picom.conf --diagnostics
#
# Aesthetic target: macOS-adjacent — rounded corners, translucent+blurred
# chrome (panels, menus), soft shadows, opaque application windows.

#################################
#            Backend            #
#################################

# glx, not egl: `picom --diagnostics` on this box warns the egl backend is
# still experimental. glx is also the sample's choice.
backend = "glx";
vsync = true;
use-damage = true;
dithered-present = false;

#################################
#            Corners            #
#################################

# Rounded corners on everything by default; specific windows opt out in `rules`.
corner-radius = 10;

# picom's own detection of already-rounded windows, so it does not double-round
# GTK client-side-decorated windows. Unrelated to corner-radius (man: "Has
# nothing to do with `corner-radius`").
detect-rounded-corners = true;

#################################
#            Shadows            #
#################################

# Soft and diffuse rather than tight and dark: large radius, low opacity, and
# an offset of -radius so the shadow sits centred behind the window.
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = -18;
shadow-offset-y = -18;

#################################
#             Blur              #
#################################

# dual_kawase is the cheap, good-looking blur (man: BLUR section). strength is
# 0-20; 7 reads as frosted glass without turning to mush. This only shows
# through windows that are actually translucent — see the opacity rules below.
blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;

#################################
#            Fading             #
#################################

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

#################################
#          Animations           #
#################################

# picom 13 has NATIVE animations (man picom, ANIMATIONS section). This is the
# built-in `preset` syntax, NOT the old picom-animations fork's syntax.
#
# WHICH TRIGGER FIRES WHEN, measured on this machine on 2026-08-22 by running
#   picom --config ~/i3-setup/picom.conf --log-level=debug --log-file=/tmp/p.log
# and grepping for "Starting animation" while driving i3:
#
#   i3 action                     trigger seen
#   ----------------------------  ------------------------------------------
#   switch AWAY from a workspace  hide   (for every window left behind)
#   switch TO a workspace         open   (for every window revealed)
#   $mod+m  (move scratchpad)     hide
#   $mod+Shift+m (scratchpad show) show
#   new window / window closed    open / close
#
# So `hide` is shared: leaving a workspace and minimizing look identical to
# picom. The global hide/show pair below is therefore the LIGHT one, tuned for
# how often a workspace switch happens; the heavy shrink-to-the-bottom
# minimize animation is attached only to windows carrying the _I3_MINIMIZED
# property, in the window rules further down. scripts/minimize.sh sets that
# property just before `move scratchpad`, which is what tells the two apart.

animations = (
        # --- Window open: new window, and every window revealed by switching
        # --- to a workspace. Scale + fade, the macOS open feel.
        {
                triggers = [ "open" ];
                preset = "appear";
                scale = 0.92;
                duration = 0.15;
        },
        {
                triggers = [ "close" ];
                preset = "disappear";
                scale = 0.94;
                duration = 0.12;
        },

        # --- SWITCHING BETWEEN WORKSPACES ---------------------------------
        # `hide` fires for every window on the workspace you are leaving. Kept
        # short and in-place: this runs on every $mod+1..0, so anything longer
        # than ~0.15s reads as lag rather than polish. It pairs with the
        # `open` animation above, which plays on the windows coming in.
        {
                triggers = [ "hide" ];
                preset = "disappear";
                scale = 0.92;
                duration = 0.14;
        },
        # `show` only ever fires for a window coming back out of the
        # scratchpad; the reverse of the above, a touch slower so the window
        # arrives rather than snaps.
        {
                triggers = [ "show" ];
                preset = "appear";
                scale = 0.92;
                duration = 0.16;
        },

        # --- SWITCHING FOCUS BETWEEN WINDOWS ------------------------------
        # There is no `focus` trigger in picom 13. What exists is the pair of
        # opacity triggers, so focus is animated indirectly: the window rules
        # below give unfocused normal windows opacity 0.92, and moving focus
        # therefore raises one window's opacity and lowers another's, which is
        # exactly what these two scripts animate.
        #
        # Without them the change still happens, but through `fading`
        # (fade-in-step 0.06 every 8ms), which crosses a 0.08 opacity gap in
        # about 11ms — instant, i.e. no visible transition at all. These give
        # it a real duration.
        #
        # Focus-in is quicker than focus-out: the window you moved to should
        # feel like it answers immediately, the one you left can settle back.
        # Shadow opacity is deliberately NOT animated here — the window is
        # staying on screen, and pinning shadow-opacity to the window opacity
        # would darken its shadow mid-animation and snap it back at the end.
        {
                triggers = [ "increase-opacity" ];
                opacity = {
                        curve    = "cubic-bezier(0.33, 1.0, 0.68, 1.0)";  # ease-out
                        duration = 0.13;
                        start    = "window-raw-opacity-before";
                        end      = "window-raw-opacity";
                };
        },
        {
                triggers = [ "decrease-opacity" ];
                opacity = {
                        curve    = "cubic-bezier(0.33, 1.0, 0.68, 1.0)";
                        duration = 0.20;
                        start    = "window-raw-opacity-before";
                        end      = "window-raw-opacity";
                };
        }
);

#################################
#         Window rules          #
#################################

# v13 rules system. NOTE: using `rules` disables ALL the old exclude options
# (shadow-exclude, rounded-corners-exclude, opacity-rule, wintypes, ...) —
# man picom, WINDOW RULES: "If window rules option is used, none of the above
# options will have any effect." So everything must be expressed here.
#
# It also means rounded corners are NO LONGER auto-disabled for fullscreen
# windows; the first rule restores that.
rules = (
        # Fullscreen: square corners, no shadow. Without this, video and
        # fullscreen apps get rounded corners cut out of the picture.
        { match = "fullscreen";
          corner-radius = 0; shadow = false; },

        # UNFOCUSED WINDOWS sit slightly back. This is not decoration for its
        # own sake: it is the only way to animate a focus change, because
        # picom 13 has no `focus` trigger — the opacity change is what fires
        # increase-opacity / decrease-opacity, and those carry the animation
        # scripts above.
        #
        # Scoped to plain application windows: `!fullscreen` keeps video at
        # full opacity, and window_type = 'normal' keeps dialogs, menus,
        # tooltips, the panels and the desktop out of it (the desktop is never
        # focused, so without this it would be permanently faded).
        #
        # Raise this to 1.0 to switch the whole effect off; the two opacity
        # animation scripts then simply never have anything to animate.
        { match = "!focused && !fullscreen && window_type = 'normal'";
          opacity = 0.92; },

        # THE TOP PANEL. Both xfce4-panel windows are class Xfce4-panel, both
        # are window_type=dock, and BOTH are full screen width (measured from
        # i3's tree: top 1600x27+0+0, dock 1600x49+0+851). So "full width"
        # cannot tell them apart — position can. y = 0 is the top panel.
        # Square corners so it sits flush against the screen edge like a
        # macOS menu bar.
        { match = "window_type = 'dock' && y = 0";
          corner-radius = 0;
          opacity = 0.88;
          blur-background = true;
          shadow = false; },

        # THE DOCK (panel-2, the autohiding launcher bar at the bottom).
        # Any dock that is NOT at y = 0. Keeps the global corner-radius and
        # gains a shadow, so it reads as a floating slab.
        { match = "window_type = 'dock' && y != 0";
          opacity = 0.88;
          blur-background = true;
          shadow = true; },

        # Menus and popups: translucent + blurred, slightly tighter radius.
        { match = "window_type = 'popup_menu'   || "
                  "window_type = 'dropdown_menu' || "
                  "window_type = 'menu'";
          opacity = 0.95; corner-radius = 8; blur-background = true; },

        # Tooltips and notifications: no shadow, no fade, no rounding artefacts.
        { match = "window_type = 'tooltip'";
          shadow = false; fade = false; corner-radius = 6; },
        { match = "window_type = 'notification' || name = 'Notification'";
          shadow = true; corner-radius = 8; },

        # i3 helpers draw their own rectangles; rounding them looks broken.
        { match = "class_g = 'i3-frame' || class_g = 'i3bar' || class_g = 'i3-nagbar'";
          corner-radius = 0; shadow = false; },

        # Desktop background never gets shadow or rounding.
        { match = "window_type = 'desktop'";
          corner-radius = 0; shadow = false; blur-background = false; },

        # Windows that draw their own shadow via GTK client-side decorations
        # would otherwise get a second one.
        { match = "_GTK_FRAME_EXTENTS@";
          shadow = false; },

        # MINIMIZED TO THE BOTTOM OF THE SCREEN. scripts/minimize.sh sets
        # _I3_MINIMIZED on the focused window and only then runs
        # `move scratchpad`, so this rule is what separates a real minimize
        # from the `hide` that a workspace switch fires. scripts/unminimize.sh
        # removes the property again shortly after `scratchpad show`, so a
        # window does not keep falling off the screen on later workspace
        # switches.
        #
        # No preset does this: slide-out/fly-out give direction but no
        # scaling, appear/disappear give scaling but no direction. So this is
        # a custom script (man picom, ANIMATIONS "Advanced"), built only from
        # NON-experimental output variables: offset-y, scale-x, scale-y,
        # opacity. (saved-image-blend and the size/position/geometry triggers
        # are the experimental ones; none are used here.)
        #
        # tmp- prefix: the manpage reserves names starting with `var-`, `tmp-`,
        # `user-`, or a single letter plus a dash, promising never to use them
        # for future built-in variables. A plain name like `travel` could be
        # shadowed by a context variable in a later picom release.
        #
        # Scale origin is the window's TOP-LEFT corner (documented), so
        # shrinking alone pins the top-left; the offset-y is what carries it
        # down to the bottom edge of whichever monitor the window is on.
        # Distance is computed from context variables, never a hardcoded pixel
        # count, so it is correct on the laptop panel and on a docked monitor.
        { match = "_I3_MINIMIZED@";
          animations = (
                # hide = shrink + fall + fade.
                {
                        triggers = [ "hide" ];

                        # From the window's top edge to the bottom of its
                        # monitor. NOTE: minus signs need surrounding spaces —
                        # the manpage warns that `a-10` parses as a variable
                        # named "a-10".
                        tmp-travel = "window-monitor-y + window-monitor-height - window-y";

                        offset-y = {
                                curve    = "cubic-bezier(0.32, 0.0, 0.67, 0.0)";  # ease-in: accelerates away
                                duration = 0.26;
                                start    = 0;
                                end      = "tmp-travel";
                        };
                        scale-x = {
                                curve    = "cubic-bezier(0.32, 0.0, 0.67, 0.0)";
                                duration = 0.26;
                                start    = 1.0;
                                end      = 0.18;
                        };
                        scale-y = {
                                curve    = "cubic-bezier(0.32, 0.0, 0.67, 0.0)";
                                duration = 0.26;
                                start    = 1.0;
                                end      = 0.18;
                        };
                        opacity = {
                                curve    = "linear";
                                duration = 0.26;
                                start    = "window-raw-opacity-before";
                                end      = 0;
                        };
                        # Keep the shadow glued to the window; the manpage
                        # notes offset-y does not move the shadow on its own.
                        shadow-offset-y = "offset-y";
                        shadow-scale-x  = "scale-x";
                        shadow-scale-y  = "scale-y";
                        shadow-opacity  = "opacity";
                },
                # show = the exact reverse.
                {
                        triggers = [ "show" ];

                        tmp-travel = "window-monitor-y + window-monitor-height - window-y";

                        offset-y = {
                                curve    = "cubic-bezier(0.33, 1.0, 0.68, 1.0)";  # ease-out: arrives gently
                                duration = 0.28;
                                start    = "tmp-travel";
                                end      = 0;
                        };
                        scale-x = {
                                curve    = "cubic-bezier(0.33, 1.0, 0.68, 1.0)";
                                duration = 0.28;
                                start    = 0.18;
                                end      = 1.0;
                        };
                        scale-y = {
                                curve    = "cubic-bezier(0.33, 1.0, 0.68, 1.0)";
                                duration = 0.28;
                                start    = 0.18;
                                end      = 1.0;
                        };
                        opacity = {
                                curve    = "linear";
                                duration = 0.28;
                                start    = 0;
                                end      = "window-raw-opacity";
                        };
                        shadow-offset-y = "offset-y";
                        shadow-scale-x  = "scale-x";
                        shadow-scale-y  = "scale-y";
                        shadow-opacity  = "opacity";
                }
          ); }
);

#################################
#           Detection           #
#################################

detect-client-opacity = true;
detect-transient = true;
