# ~/i3-setup/picom.conf — picom v13 (verified with `picom --version`)
#
# Derived from /usr/share/doc/picom/picom.sample.conf, which ships with the
# installed package and therefore matches this version.
# Every non-default option below is documented in `man 1 picom` on this machine.
# Validate with:  picom --config ~/i3-setup/picom.conf --diagnostics
#
# Aesthetic target: macOS-adjacent — rounded corners, translucent+blurred
# chrome (panels, menus), soft shadows, opaque application windows.

#################################
#            Backend            #
#################################

# glx, not egl: `picom --diagnostics` on this box warns the egl backend is
# still experimental. glx is also the sample's choice.
backend = "glx";
vsync = true;
use-damage = true;
dithered-present = false;

#################################
#            Corners            #
#################################

# Rounded corners on everything by default; specific windows opt out in `rules`.
corner-radius = 10;

# picom's own detection of already-rounded windows, so it does not double-round
# GTK client-side-decorated windows. Unrelated to corner-radius (man: "Has
# nothing to do with `corner-radius`").
detect-rounded-corners = true;

#################################
#            Shadows            #
#################################

# Soft and diffuse rather than tight and dark: large radius, low opacity, and
# an offset of -radius so the shadow sits centred behind the window.
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.35;
shadow-offset-x = -18;
shadow-offset-y = -18;

#################################
#             Blur              #
#################################

# dual_kawase is the cheap, good-looking blur (man: BLUR section). strength is
# 0-20; 7 reads as frosted glass without turning to mush. This only shows
# through windows that are actually translucent — see the opacity rules below.
blur-method = "dual_kawase";
blur-strength = 7;
blur-background = true;

#################################
#            Fading             #
#################################

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;

#################################
#          Animations           #
#################################

# picom 13 has NATIVE animations (man picom, ANIMATIONS section). This is the
# built-in `preset` syntax, NOT the old picom-animations fork's syntax.
# "appear"/"disappear" combine scaling with fading — the macOS open/close feel.
animations = ({
        triggers = [ "open", "show" ];
        preset = "appear";
        scale = 0.94;
        duration = 0.16;
}, {
        triggers = [ "close", "hide" ];
        preset = "disappear";
        scale = 0.94;
        duration = 0.12;
});

#################################
#         Window rules          #
#################################

# v13 rules system. NOTE: using `rules` disables ALL the old exclude options
# (shadow-exclude, rounded-corners-exclude, opacity-rule, wintypes, ...) —
# man picom, WINDOW RULES: "If window rules option is used, none of the above
# options will have any effect." So everything must be expressed here.
#
# It also means rounded corners are NO LONGER auto-disabled for fullscreen
# windows; the first rule restores that.
rules = (
        # Fullscreen: square corners, no shadow. Without this, video and
        # fullscreen apps get rounded corners cut out of the picture.
        { match = "fullscreen";
          corner-radius = 0; shadow = false; },

        # THE TOP PANEL. Both xfce4-panel windows are class Xfce4-panel, both
        # are window_type=dock, and BOTH are full screen width (measured from
        # i3's tree: top 1600x27+0+0, dock 1600x49+0+851). So "full width"
        # cannot tell them apart — position can. y = 0 is the top panel.
        # Square corners so it sits flush against the screen edge like a
        # macOS menu bar.
        { match = "window_type = 'dock' && y = 0";
          corner-radius = 0;
          opacity = 0.88;
          blur-background = true;
          shadow = false; },

        # THE DOCK (panel-2, the autohiding launcher bar at the bottom).
        # Any dock that is NOT at y = 0. Keeps the global corner-radius and
        # gains a shadow, so it reads as a floating slab.
        { match = "window_type = 'dock' && y != 0";
          opacity = 0.88;
          blur-background = true;
          shadow = true; },

        # Menus and popups: translucent + blurred, slightly tighter radius.
        { match = "window_type = 'popup_menu'   || "
                  "window_type = 'dropdown_menu' || "
                  "window_type = 'menu'";
          opacity = 0.95; corner-radius = 8; blur-background = true; },

        # Tooltips and notifications: no shadow, no fade, no rounding artefacts.
        { match = "window_type = 'tooltip'";
          shadow = false; fade = false; corner-radius = 6; },
        { match = "window_type = 'notification' || name = 'Notification'";
          shadow = true; corner-radius = 8; },

        # i3 helpers draw their own rectangles; rounding them looks broken.
        { match = "class_g = 'i3-frame' || class_g = 'i3bar' || class_g = 'i3-nagbar'";
          corner-radius = 0; shadow = false; },

        # Desktop background never gets shadow or rounding.
        { match = "window_type = 'desktop'";
          corner-radius = 0; shadow = false; blur-background = false; },

        # Windows that draw their own shadow via GTK client-side decorations
        # would otherwise get a second one.
        { match = "_GTK_FRAME_EXTENTS@";
          shadow = false; }
);

#################################
#           Detection           #
#################################

detect-client-opacity = true;
detect-transient = true;
